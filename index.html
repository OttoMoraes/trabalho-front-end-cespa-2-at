<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Inicial BB</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="tela">

    <!-- Barra superior -->
    <header>
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/28/Banco_do_Brasil_logo.svg"
             class="logo">

        <div class="icons">
            <i class="fa-regular fa-bell"></i>
            <i class="fa-regular fa-message"></i>
        </div>
    </header>

    <!-- Faixa transparente -->
    <div class="shape"></div>

    <!-- Texto -->
    <div class="texto">
        <h1>
            Que bom<br>
            você por aqui!
        </h1>
    </div>

    <!-- Card do usuário -->
    <div class="card">
        <img src="https://i.pravatar.cc/100" class="foto">

        <div class="info">
            <strong>Bruno</strong>
            <p>Ag. *** &nbsp;&nbsp; • &nbsp;&nbsp; Cc. ****</p>
        </div>

        <i class="fa-regular fa-user"></i>
    </div>

    <!-- Trocar conta -->
    <div class="trocar">
        <i class="fa-solid fa-rotate"></i>
        <span>Trocar conta</span>
    </div>

    <!-- Rodapé -->
    <div class="footer">
        Benefícios para você. Confira!
        <br>
        <i class="fa-solid fa-chevron-down"></i>
    </div>

</div>

</body>
</html>
